name: 问题反馈
description: 报告安装、订单、回款、发货或利润问题
title: "[问题] "
body:
  - type: textarea
    id: steps
    attributes:
      label: 发生了什么，怎样复现？
      description: 请写操作步骤、实际结果和期望结果；请勿提供真实订单及收货信息。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 版本与环境
      placeholder: 例如 Windows 11、源码启动、提交号
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或错误信息
      description: 不要上传 API 密钥、数据库、客户资料或旧版本生成的供货商访问链接。
  - type: checkboxes
    id: privacy
    attributes:
      label: 发布前检查
      options:
        - label: 我已去除客户资料、账号凭据和旧版本生成的真实供货商访问链接。
          required: true
