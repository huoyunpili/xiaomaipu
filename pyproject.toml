[project]
name = "xianyu-seller-backoffice"
version = "0.6.0rc1"
description = "Single-shop seller backoffice"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.6,<5.7",
  "gunicorn>=23,<24; sys_platform != 'win32'",
  "python-dotenv>=1,<2",
  "qrcode>=8,<9",
  "openpyxl>=3.1,<4",
  "waitress>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-django>=4.11,<5", "ruff>=0.12,<1", "mypy>=1.15,<2", "django-stubs>=5.2,<5.3", "playwright>=1.50,<2"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".docx_work", "scripts/xgj_probe/vendor_tmp", ".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.config.settings.test"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["browser: real browser flow against isolated PostgreSQL"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
files = ["app"]
exclude = ["migrations/"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "app.config.settings.test"
