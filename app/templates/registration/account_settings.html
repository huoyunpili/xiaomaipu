{% extends 'base.html' %}
{% block title %}我的账号 · 鱼管家{% endblock %}
{% block content %}
<a class="back" href="{% url 'dashboard' %}">← 返回工作台</a>
<section class="card login">
  <p class="eyebrow">我的账号</p>
  <h1>修改登录信息</h1>
  <p class="muted">用户名和密码都可以改成你容易记住的内容。密码留空就不会修改。</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">保存账号资料</button>
  </form>
</section>
{% endblock %}
