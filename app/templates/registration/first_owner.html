{% extends 'base.html' %}
{% block title %}创建店主账号 · 小卖铺{% endblock %}
{% block content %}
<section class="card login">
  <p class="eyebrow">第一次使用</p>
  <h1>创建你的店主账号</h1>
  <p class="muted">用户名和密码由你自己设置。创建完成后，这个入口会自动关闭。</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">创建账号并进入后台</button>
  </form>
</section>
{% endblock %}
