{% extends 'base.html' %}{% block content %}<p class="eyebrow">系统设置</p><h1>店铺资料</h1><div class="grid"><section class="card"><h2>基本信息</h2><form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">保存资料</button></form></section><section class="card"><h2>销售渠道</h2><a href="{% url 'channel-new' %}">新增渠道</a><p class="muted">各渠道将共用商品、库存和经营账目。</p><ul class="channels">{% for channel in channels %}<li><a href="{% url 'channel-edit' channel.id %}">{{ channel.name }}</a><span>{% if channel.is_active %}已启用{% else %}已停用{% endif %}</span></li>{% endfor %}</ul></section></div>{% endblock %}
