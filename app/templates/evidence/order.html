<section class="card section-title"><h2>发货取证</h2>{% for video in videos %}{% if video.active %}<video controls preload="metadata" style="width:100%;max-height:420px" src="{% url 'evidence-video' video.id %}"></video><p><a href="{% url 'evidence-video' video.id %}?download=1">下载原视频</a></p>{% else %}<p><a href="{% url 'evidence-video' video.id %}?download=1">历史视频 · {{ video.created_at|date:'m-d H:i' }}</a></p>{% endif %}{% empty %}<p>尚未上传视频，不影响发货。</p>{% endfor %}<a class="button" href="{% url 'evidence-upload' order.id %}">上传 / 替换取证视频</a><details><summary>手机扫码上传</summary><img width="180" height="180" alt="此订单上传入口二维码" src="{% url 'evidence-qr' order.id %}"><p>手机需能访问本站并登录。本机 localhost 地址仅限本机使用；局域网或部署域名配置后可扫码。</p></details></section>
