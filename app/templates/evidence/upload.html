{% extends 'base.html' %}{% block content %}<a href="{% url 'order-detail' order.id %}">← 返回订单</a><h1>上传取证视频</h1><p>{{ order.number }} · {{ order.customer_name }}</p><p>建议一段视频拍到商品及配件、状态或功能、封箱面单。只作拍摄提醒，不逐项强制检查。</p><section class="card form-card"><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button>上传并保存</button></form><p>重新上传会替换当前展示的视频，旧版本保留。上传失败可以重新提交。</p></section>{% endblock %}
