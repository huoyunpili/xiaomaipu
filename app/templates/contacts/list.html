{% extends 'base.html' %}{% block content %}<div class="page-heading"><h1>客户</h1><a class="button" href="{% url 'customer-new' %}">新增客户</a></div><form class="search"><input name="q" value="{{ q }}" placeholder="称呼、联系方式或标签" aria-label="搜索客户"><button>搜索</button></form><div class="grid">{% for customer in customers %}<section class="card"><h2><a href="{% url 'customer-detail' customer.id %}">{{ customer.name }}</a></h2><p>{{ customer.tags }}</p><p>{{ customer.suggestion_label }}</p></section>{% empty %}<p>暂无客户档案。</p>{% endfor %}</div>{% include 'procurement/pagination.html' with page=customers %}{% endblock %}
