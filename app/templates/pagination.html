{% if page.has_other_pages %}<nav class="pagination" aria-label="分页">{% if page.has_previous %}<a href="?q={{ query|urlencode }}&status={{ selected_status|urlencode }}&page={{ page.previous_page_number }}">上一页</a>{% endif %}<span>第 {{ page.number }} / {{ page.paginator.num_pages }} 页</span>{% if page.has_next %}<a href="?q={{ query|urlencode }}&status={{ selected_status|urlencode }}&page={{ page.next_page_number }}">下一页</a>{% endif %}</nav>{% endif %}
